[project]
name = "optimizer-music-genre-classifier"
version = "0.1.0"
description = "A song-genre classifier prompt that an optimizer rewrites, with the score of every trial and the winning prompt kept in Opik"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "opik>=2.2.100",
    "opik-optimizer>=3.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
genre = "genreclf.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genreclf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
