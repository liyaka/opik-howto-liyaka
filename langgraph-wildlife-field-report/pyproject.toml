[project]
name = "langgraph-wildlife-field-report"
version = "0.1.0"
description = "A planner/researcher/writer LangGraph team that turns ranger field notes into a season summary"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "opik>=2.2.100",
    "python-dotenv>=1.0",
]

[project.scripts]
field-report = "field_report.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["field_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
