services:
  n8n:
    image: n8nio/n8n:2.41.7
    container_name: n8n-food-bank-volunteers
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_food_bank_data:/home/node/.n8n

volumes:
  n8n_food_bank_data:
