[project]
name = "smolagents-weather-station-analyst"
version = "0.1.0"
description = "smolagents CodeAgent that audits a weather-station CSV by writing pandas code"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "smolagents>=1.20",
]

[dependency-groups]
dev = ["pytest>=8"]
