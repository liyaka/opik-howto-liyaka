[project]
name = "whisper-vet-voicemail-triage"
version = "0.1.0"
description = "Veterinary-clinic voicemail triage: TTS voicemails -> speech-to-text -> urgency level and callback list"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik>=2.2.100",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]
