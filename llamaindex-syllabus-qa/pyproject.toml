[project]
name = "llamaindex-syllabus-qa"
version = "0.1.0"
description = "Q&A over course-syllabus PDFs with LlamaIndex"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.25",
    "llama-index-embeddings-openai>=0.3",
    "llama-index-readers-file>=0.7.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]
