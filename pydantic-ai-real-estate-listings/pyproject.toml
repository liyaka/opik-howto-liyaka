[project]
name = "pydantic-ai-real-estate-listings"
version = "0.1.0"
description = "Pydantic AI agent that extracts typed property listings from messy agent notes, traced and tested with Opik"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "logfire>=4.0",
    "opik>=2.2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
listings = "listings.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["listings"]
