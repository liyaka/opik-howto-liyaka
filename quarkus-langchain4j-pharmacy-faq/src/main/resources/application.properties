quarkus.http.port=3291

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=60s

pharmacy.docs-dir=docs

# Opik: without these two switches the llm spans carry model and tokens but no text, so the
# span's Input and Output tabs stay empty. They add gen_ai.prompt / gen_ai.completion.
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true

# Opik: OTLP over http/protobuf to the Opik OpenTelemetry endpoint. Quarkus appends /v1/traces itself.
# projectName picks the Opik project; Comet-Workspace picks the workspace. A local Opik needs no key.
quarkus.application.name=quarkus-langchain4j-pharmacy-faq
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.endpoint=${OPIK_OTEL_ENDPOINT:http://localhost:5173/api/v1/private/otel}
quarkus.otel.exporter.otlp.traces.headers=Comet-Workspace=${OPIK_WORKSPACE:default},projectName=quarkus-langchain4j-pharmacy-faq
# Opik: drops the HTTP server span so the root span (and the trace Input/Output columns) are
# the question and answer instead of HTTP attributes.
quarkus.otel.instrument.vertx-http=false
