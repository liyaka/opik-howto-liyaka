[project]
name = "temporal-py-film-festival-review"
version = "0.1.0"
description = "A durable film-festival submission review workflow on Temporal, traced end to end in Opik"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio[opentelemetry]>=1.8",
    "openai>=1.50",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "opik==2.2.100",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
